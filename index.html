<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricity Bill Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 30px;
}
.container {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 4px 18px #0001;
}
h1, h2 { text-align: center; color: #174a7e; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 7px;
}
input { border: 1px solid #ccc; }
button {
  background: #1769aa;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { background: #125487; }
.secondary { background: #555; }
#calculator, #userInfo { display: none; }
#result {
  margin-top: 15px;
  padding: 15px;
  background: #e8f5e9;
  border-radius: 8px;
}
.small { text-align: center; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
<h1>Electricity Bill Calculator</h1>

<div id="authSection">
  <h2 id="authTitle">Login</h2>
  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">

  <button id="authButton">Login</button>
  <button id="toggleButton" class="secondary">Create Account</button>
  <p id="authMessage" class="small"></p>
</div>

<div id="calculator">
  <p id="userInfo" class="small"></p>
  <h2>Calculate Bill</h2>

  <input type="text" id="consumerName" placeholder="Consumer Name">
  <input type="text" id="consumerId" placeholder="Consumer ID">
  <input type="number" id="units" placeholder="Units Consumed">

  <button id="calculateButton">Calculate Bill</button>
  <button id="clearButton" class="secondary">Clear</button>
  <button id="logoutButton" class="secondary">Logout</button>

  <div id="result"></div>
</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// REPLACE THIS CONFIG WITH YOUR FIREBASE CONFIG
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB8yKjDkUqGJCjQLryv-x0yKu4L7UugCeQ",
  authDomain: "electricitybillcalculato-aa64e.firebaseapp.com",
  projectId: "electricitybillcalculato-aa64e",
  storageBucket: "electricitybillcalculato-aa64e.firebasestorage.app",
  messagingSenderId: "1031628376769",
  appId: "1:1031628376769:web:9bc5b2cde748c74585a240",
  measurementId: "G-NVVPQ3BRWE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isRegistering = false;

const authSection = document.getElementById("authSection");
const calculator = document.getElementById("calculator");
const authTitle = document.getElementById("authTitle");
const authButton = document.getElementById("authButton");
const toggleButton = document.getElementById("toggleButton");
const authMessage = document.getElementById("authMessage");

toggleButton.addEventListener("click", () => {
  isRegistering = !isRegistering;
  authTitle.textContent = isRegistering ? "Create Account" : "Login";
  authButton.textContent = isRegistering ? "Register" : "Login";
  toggleButton.textContent = isRegistering ? "Back to Login" : "Create Account";
  authMessage.textContent = "";
});

authButton.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    authMessage.textContent = "Enter email and password.";
    return;
  }

  try {
    if (isRegistering) {
      await createUserWithEmailAndPassword(auth, email, password);
      authMessage.textContent = "Account created successfully!";
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (error) {
    authMessage.textContent = error.message;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    authSection.style.display = "none";
    calculator.style.display = "block";
    document.getElementById("userInfo").style.display = "block";
    document.getElementById("userInfo").textContent =
      "Logged in as: " + user.email;
  } else {
    authSection.style.display = "block";
    calculator.style.display = "none";
  }
});

document.getElementById("calculateButton").addEventListener("click", () => {
  const name = document.getElementById("consumerName").value.trim();
  const id = document.getElementById("consumerId").value.trim();
  const units = Number(document.getElementById("units").value);
  const result = document.getElementById("result");

  if (!name || !id || document.getElementById("units").value === "" ||
      !Number.isFinite(units) || units < 0) {
    result.innerHTML = "Please enter valid consumer details and units.";
    return;
  }

  let bill = 0;

  if (units <= 100) {
    bill = units * 3;
  } else if (units <= 200) {
    bill = (100 * 3) + ((units - 100) * 5);
  } else {
    bill = (100 * 3) + (100 * 5) + ((units - 200) * 7);
  }

  result.innerHTML =
    "<h3>Electricity Bill</h3>" +
    "<p>Consumer Name: " + escapeHTML(name) + "</p>" +
    "<p>Consumer ID: " + escapeHTML(id) + "</p>" +
    "<p>Units Consumed: " + units + "</p>" +
    "<h3>Total Bill: ₹" + bill.toFixed(2) + "</h3>";
});

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

document.getElementById("clearButton").addEventListener("click", () => {
  document.getElementById("consumerName").value = "";
  document.getElementById("consumerId").value = "";
  document.getElementById("units").value = "";
  document.getElementById("result").innerHTML = "";
});

document.getElementById("logoutButton").addEventListener("click", () => {
  signOut(auth);
});
</script>
</body>
</html>
